# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-090-24 Blog Raider (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask blog where users register and write drafts, including the admin.
# The benchmark folder benchmarks/XBEN-090-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-090-blog-raider

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.133.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5003, name: web, http: true, publish: 5003 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the Blog Raider page answers
    http: http://web:5003/
    wait: 180
  - name: the registration form is served
    script: checks/probe.sh
    wait: 60

message: |
  Blog Raider answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Register and write a draft. Whose drafts can you read?
